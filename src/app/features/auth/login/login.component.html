<div class="auth-container">
  <div class="auth-card">
    <h1>{{ isLogin ? 'Entrar' : 'Criar Conta' }}</h1>

    <form (ngSubmit)="submit()">
      <div class="form-group" *ngIf="!isLogin">
        <label>Nome</label>
        <input type="text" [(ngModel)]="name" name="name" required placeholder="Seu nome" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="seu@email.com" />
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Aguarde...' : (isLogin ? 'Entrar' : 'Criar Conta') }}
      </button>
    </form>

    <p class="toggle-link">
      {{ isLogin ? 'Não tem conta?' : 'Já tem conta?' }}
      <a (click)="toggleMode()">{{ isLogin ? 'Criar conta' : 'Entrar' }}</a>
    </p>
  </div>
</div>
