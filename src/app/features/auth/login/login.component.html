<div class="page">
  <div class="bg-image"></div>
  <div class="overlay"></div>

  <div class="form-wrap">
    <div class="brand">
      <span>🏨</span>
      <span class="brand-name">Hotel Fácil</span>
    </div>

    <h2>{{ isLogin ? 'Bem-vindo de volta' : 'Crie sua conta' }}</h2>

    <form (ngSubmit)="submit()">
      <div class="field" *ngIf="!isLogin">
        <input type="text" [(ngModel)]="name" name="name" required placeholder="Nome completo" />
      </div>
      <div class="field">
        <input type="email" [(ngModel)]="email" name="email" required placeholder="E-mail" />
      </div>
      <div class="field">
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Senha" />
      </div>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Aguarde...' : (isLogin ? 'Entrar' : 'Criar conta') }}
      </button>
    </form>

    <p class="toggle">
      {{ isLogin ? 'Não tem conta?' : 'Já tem conta?' }}
      <a (click)="toggleMode()">{{ isLogin ? 'Cadastre-se' : 'Entrar' }}</a>
    </p>
  </div>
</div>
