<div class="container">
  <div class="header">
    <h1>Hotéis Disponíveis</h1>
    <div class="header-actions">
      <button class="btn-secondary" (click)="verReservas()">Minhas Reservas</button>
      <button class="btn-logout" (click)="logout()">Sair</button>
    </div>
  </div>

  <div class="loading" *ngIf="loading">Carregando hotéis...</div>

  <div class="empty-state" *ngIf="!loading && hotels.length === 0">
    <p>Nenhum hotel encontrado.</p>
  </div>

  <div class="hotel-card" *ngFor="let hotel of hotels">
    <div class="hotel-info">
      <h2>{{ hotel.name }}</h2>
      <p class="hotel-location">{{ hotel.city }} - {{ hotel.state }}</p>
      <p class="hotel-description" *ngIf="hotel.description">{{ hotel.description }}</p>
    </div>
    <div class="hotel-action">
      <button (click)="verQuartos(hotel.id)">Ver Quartos</button>
    </div>
  </div>
</div>
