<div class="container">
  <button class="btn-back" (click)="voltar()">← Voltar</button>
  <h1>Nova Reserva</h1>

  <div class="room-summary" *ngIf="room">
    <p><strong>Quarto {{ room.roomNumber }}</strong> — {{ room.type }}</p>
    <p>Capacidade: {{ room.capacity }} pessoa(s) · R$ {{ room.price }}/noite</p>
  </div>

  <form (ngSubmit)="submit()">
    <div class="form-group">
      <label>Nome do hóspede</label>
      <input type="text" [(ngModel)]="guestName" name="guestName" required placeholder="Nome completo" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="guestEmail" name="guestEmail" required placeholder="email@exemplo.com" />
    </div>

    <div class="date-row">
      <div class="form-group">
        <label>Check-in</label>
        <input type="date" [(ngModel)]="checkIn" name="checkIn" required />
      </div>
      <div class="form-group">
        <label>Check-out</label>
        <input type="date" [(ngModel)]="checkOut" name="checkOut" required />
      </div>
    </div>

    <div class="total" *ngIf="totalPrice > 0">
      Total: <strong>R$ {{ totalPrice }}</strong>
    </div>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div class="actions">
      <button type="submit" [disabled]="loading || totalPrice <= 0">
        {{ loading ? 'Aguarde...' : 'Confirmar Reserva' }}
      </button>
    </div>
  </form>
</div>
